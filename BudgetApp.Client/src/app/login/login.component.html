<div class="container h-100 d-flex align-items-center justify-content-center">
  <div class="card w-100 login-card">
    <div class="card-body">
      <div class="text-center mb-3 h3">Build-a-Budget&trade;</div>
      <h4>Login</h4>
      <form (submit)="login()">
        <div class="form-group mb-3">
          <label for="username">Email Address:</label>
          <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" required>
        </div>
        <div class="form-group mb-3">
          <label for="password">Password:</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-info text-white me-2 loading-button">Login</button>
        <a href="/register" class="btn btn-primary loading-link">Register Account</a>
        <div *ngIf="error" class="text-danger mt-3">{{ error }}</div>
      </form>
    </div>
  </div>
</div>
