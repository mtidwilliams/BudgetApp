<div class="container">
    <span class="navbar-brand">Build-a-Budget&trade;</span>
    <h2>Login</h2>
    <form (submit)="login()">
      <div class="form-group mb-3">
        <label for="username">Email Address:</label>
        <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" required>
      </div>
      <div class="form-group mb-3">
        <label for="password">Password:</label>
        <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary me-2">Login</button>
      <a class="btn btn-secondary" href="/register">Register Account</a>
      <div *ngIf="error" class="text-danger mt-3">{{ error }}</div>
    </form>
  </div>
