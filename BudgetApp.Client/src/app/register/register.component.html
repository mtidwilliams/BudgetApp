<div class="container">
    <span class="navbar-brand">Build-a-Budget&trade;</span>
    <h2>Register a new account</h2>
    <form (submit)="register()">
      <div class="form-group mb-3">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" class="form-control" [(ngModel)]="firstName" name="firstName" required>
      </div>
      <div class="form-group mb-3">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" class="form-control" [(ngModel)]="lastName" name="lastName" required>
      </div>
      <div class="form-group mb-3">
        <label for="email">Email Address:</label>
        <input type="text" id="email" class="form-control" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group mb-3">
        <label for="password">Password:</label>
        <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group mb-3">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>
      <button type="submit" class="btn btn-primary me-2">Submit</button>
      <a class="btn btn-secondary" href="/">Cancel</a>
      <div *ngIf="error" class="text-danger mt-3">{{ error }}</div>
    </form>
  </div>
