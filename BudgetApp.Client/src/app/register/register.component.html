<div class="container h-100 d-flex align-items-center justify-content-center">
  <div class="card w-100 register-card">
    <div class="card-body">
      <span class="navbar-brand">Build-a-Budget&trade;</span>
      <h2>Register a new account</h2>
      <form (submit)="register()">
        <div class="form-group row mb-3">
          <div class="col">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" class="form-control" [(ngModel)]="firstName" name="firstName" required autofocus>
          </div>
          <div class="col">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" class="form-control" [(ngModel)]="lastName" name="lastName" required>
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="street">Address:</label>
          <input type="text" id="street" class="form-control" [(ngModel)]="street" name="street" required>
        </div>
        <div class="form-group row mb-3">
          <div class="col">
            <label for="city">City:</label>
            <input type="text" id="city" class="form-control" [(ngModel)]="city" name="city" required>
          </div>
          <div class="col">
            <label for="state">State:</label>
            <input type="text" id="state" class="form-control" [(ngModel)]="state" name="state" required>
          </div>
          <div class="col">
            <label for="zip">Zip Code:</label>
            <input type="text" id="zip" class="form-control" [(ngModel)]="zip" name="zip" required>
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="email">Email Address:</label>
          <input type="text" id="email" class="form-control" [(ngModel)]="email" name="email" required>
        </div>
        <div class="form-group mb-3">
          <label for="password">Password:</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        <div class="form-group mb-3">
          <label for="confirmPassword">Confirm Password:</label>
          <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </div>
        <button type="submit" class="btn btn-primary me-2 loading-button">Register</button>
        <a class="btn btn-secondary loading-link" href="/">Cancel</a>
        <div *ngIf="error" class="text-danger mt-3">{{ error }}</div>
      </form>
    </div>
  </div>
</div>
